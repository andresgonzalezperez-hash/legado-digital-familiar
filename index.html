<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=APP/index.html" />
    <title>Legado Digital Familiar · Digital Legacy Vault</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader-card {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 420px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #60a5fa; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
    <script>
        window.location.replace("APP/index.html");

</head>
<body>
    <div class="loader-card">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 0.5rem 0; font-size: 1.25rem;">Cargando Bóveda Soberana...</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1rem 0;">
            Inicializando entorno seguro y motor criptográfico Web Crypto local (100% en tu navegador).
        </p>
        <p style="font-size: 0.85rem; color: #64748b; margin: 0;">

        </p>
    </div>
</body>
